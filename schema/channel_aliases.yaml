# ============================================================================
# channel_aliases.yaml — the extensible alias registry
#
# Step 2 deliverable of the universal dataset parser.
#
# Maps every canonical field/channel name to the aliases it is known by across
# datasets. Onboarding a new dataset whose naming is a *variation* on what is
# here should require NO code change — only entries in this file.
#
# MATCHING RULES (implemented in ingestion/normalizer.py):
#   1. Both the alias and the candidate column are normalized before comparison:
#      lowercased, separators (_ . - space) stripped, and a known unit suffix
#      (uv, µv, microvolt, um, µm, molar, hz, sec, s, ms) removed.
#      So `EEG_Fp1`, `eeg.fp1`, `Fp1_uV`, `FP1` all normalize to `fp1`.
#   2. Exact normalized match wins.
#   3. Failing that, a prefix/suffix strip of known modality tags
#      (eeg, fnirs, nirs, ch, chan, channel, elec) is retried.
#   4. Failing that, the column is reported UNMATCHED. It is never guessed at
#      by edit distance — a wrong-but-confident match is worse than a miss.
#
# Add a new dataset by appending its spellings to the relevant `aliases:` lists.
# ============================================================================

schema_version: 1

# ---------------------------------------------------------------------------
# EEG ELECTRODES
# ---------------------------------------------------------------------------
# `canonical` is the 10-20 standard spelling. `aliases` are additional literal
# spellings seen in the wild that rule 1 above would NOT already collapse (rule
# 1 handles pure case/separator/unit variation, so `FP1`/`eeg.fp1`/`Fp1_uV` need
# no entry). `spatial_neighbours` declares which electrodes may stand in for
# this one, in preference order, when it is absent — used ONLY when
# projection.substitution.allow_spatial_neighbours is enabled, always recorded
# in the mapping report as `approximate`, and coverage-discounted.
eeg_electrodes:

  # ── TU Berlin model positions ch00-ch29 (the projection targets) ──────────

  Fp1:
    aliases: [Fpz1, EEG Fp1-Ref]
    spatial_neighbours: [AF3, AFp1, F1]
  AFF5h:
    aliases: [AFF5, AF5]
    # AFF5h is a 10-10 intermediate position most datasets do not carry.
    spatial_neighbours: [F5, AF3, F7, F3]
  AFz:
    aliases: [AFZ]
    spatial_neighbours: [Fz, FCz, Fpz]
  F1:
    aliases: []
    spatial_neighbours: [F3, Fz]
  FC5:
    aliases: []
    spatial_neighbours: [FC3, FT7, C5]
  FC1:
    aliases: []
    spatial_neighbours: [FC3, FCz, C1]
  T7:
    aliases: [T3]          # older 10-20 naming
    spatial_neighbours: [TP7, FT7, C5]
  C3:
    aliases: []
    spatial_neighbours: [C1, C5, FC3]
  Cz:
    aliases: [CZ]
    spatial_neighbours: [C1, C2, FCz, CPz]
  CP5:
    aliases: []
    spatial_neighbours: [CP3, TP7, P5]
  CP1:
    aliases: []
    spatial_neighbours: [CP3, CPz, P1]
  P7:
    aliases: [T5]          # older 10-20 naming
    spatial_neighbours: [P5, TP7, PO7]
  P3:
    aliases: []
    spatial_neighbours: [P1, P5, CP3]
  Pz:
    aliases: [PZ]
    spatial_neighbours: [P1, P2, CPz, POz]
  POz:
    aliases: [POZ]
    spatial_neighbours: [Pz, Oz, PO3, PO4]
  O1:
    aliases: []
    spatial_neighbours: [Oz, PO3, PO7]
  Fp2:
    aliases: [EEG Fp2-Ref]
    spatial_neighbours: [AF4, AFp2, F2]
  AFF6h:
    aliases: [AFF6, AF6]
    spatial_neighbours: [F6, AF4, F8, F4]
  F2:
    aliases: []
    spatial_neighbours: [F4, Fz]
  FC2:
    aliases: []
    spatial_neighbours: [FC4, FCz, C2]
  FC6:
    aliases: []
    spatial_neighbours: [FC4, FT8, C6]
  C4:
    aliases: []
    spatial_neighbours: [C2, C6, FC4]
  T8:
    aliases: [T4]          # older 10-20 naming
    spatial_neighbours: [TP8, FT8, C6]
  CP2:
    aliases: []
    spatial_neighbours: [CP4, CPz, P2]
  CP6:
    aliases: []
    spatial_neighbours: [CP4, TP8, P6]
  P4:
    aliases: []
    spatial_neighbours: [P2, P6, CP4]
  P8:
    aliases: [T6]          # older 10-20 naming
    spatial_neighbours: [P6, TP8, PO8]
  O2:
    aliases: []
    spatial_neighbours: [Oz, PO4, PO8]
  HEOG:
    aliases: [HEO, EOGh, HEOGL, HEOG_L, hEOG, EOG_horizontal]
    spatial_neighbours: []          # ocular — never substituted
  VEOG:
    aliases: [VEO, EOGv, VEOGU, VEOG_U, vEOG, EOG_vertical]
    spatial_neighbours: []

  # ── Electrodes present in other datasets (Stroop) but not model positions ──
  # These exist so the normalizer can RECOGNIZE them (report them as known-but-
  # unused rather than "unrecognized"), and so they are available as substitutes
  # via the spatial_neighbours lists above.
  F7:  {aliases: [], spatial_neighbours: []}
  F3:  {aliases: [], spatial_neighbours: []}
  Fz:  {aliases: [FZ], spatial_neighbours: []}
  F4:  {aliases: [], spatial_neighbours: []}
  F8:  {aliases: [], spatial_neighbours: []}
  FT7: {aliases: [], spatial_neighbours: []}
  FC3: {aliases: [], spatial_neighbours: []}
  FCz: {aliases: [FCZ], spatial_neighbours: []}
  FC4: {aliases: [], spatial_neighbours: []}
  FT8: {aliases: [], spatial_neighbours: []}
  TP7: {aliases: [], spatial_neighbours: []}
  CP3: {aliases: [], spatial_neighbours: []}
  CPz: {aliases: [CPZ], spatial_neighbours: []}
  CP4: {aliases: [], spatial_neighbours: []}
  TP8: {aliases: [], spatial_neighbours: []}
  Oz:  {aliases: [OZ], spatial_neighbours: []}
  M1:  {aliases: [A1, TP9, mastoid_left], spatial_neighbours: []}
  M2:  {aliases: [A2, TP10, mastoid_right], spatial_neighbours: []}
  # Common in other montages; listed so they are recognized, not guessed.
  AF3: {aliases: [], spatial_neighbours: []}
  AF4: {aliases: [], spatial_neighbours: []}
  C1:  {aliases: [], spatial_neighbours: []}
  C2:  {aliases: [], spatial_neighbours: []}
  C5:  {aliases: [], spatial_neighbours: []}
  C6:  {aliases: [], spatial_neighbours: []}
  P1:  {aliases: [], spatial_neighbours: []}
  P2:  {aliases: [], spatial_neighbours: []}
  P5:  {aliases: [], spatial_neighbours: []}
  P6:  {aliases: [], spatial_neighbours: []}
  PO3: {aliases: [], spatial_neighbours: []}
  PO4: {aliases: [], spatial_neighbours: []}
  PO7: {aliases: [], spatial_neighbours: []}
  PO8: {aliases: [], spatial_neighbours: []}
  Fpz: {aliases: [FPZ], spatial_neighbours: []}

# ---------------------------------------------------------------------------
# fNIRS CHANNELS
# ---------------------------------------------------------------------------
# fNIRS canonical identity is `{chromophore}_ch{NN}` (see canonical_schema.yaml:
# fnirs.montage_mapping = explicit_only). Because optode indices carry no
# recoverable spatial meaning in the serving bundle, this section defines only
# how to recognize CHROMOPHORE and WAVELENGTH naming — never a positional
# mapping between datasets. That mapping, if a dataset can justify one, belongs
# in that dataset's profile under schema/datasets/.
fnirs:

  chromophores:
    hbo:
      aliases: [HbO, HbO2, oxy, oxyHb, oxygenated, O2Hb, hbo2, deoxy_corrected_oxy]
      description: oxygenated haemoglobin concentration
    hbr:
      aliases: [HbR, Hb, deoxy, deoxyHb, deoxygenated, HHb, hbr2]
      description: deoxygenated haemoglobin concentration
    hbt:
      aliases: [HbT, total, totalHb, THb]
      description: total haemoglobin — recognized but NOT a model input

  # Raw optical intensity, which must be Beer-Lambert converted before it can
  # become canonical HbO/HbR. Datasets that ship these (Stroop does) are handled
  # by ingestion/parser.py::beer_lambert, driven by the dataset profile.
  wavelengths:
    wl_760: {aliases: [760, 760nm, wl760, lambda760]}
    wl_785: {aliases: [785, 785nm, wl785, lambda785]}   # Stroop wavelength 1
    wl_830: {aliases: [830, 830nm, wl830, lambda830]}
    wl_850: {aliases: [850, 850nm, wl850, lambda850]}   # Stroop wavelength 2

  # Channel index spellings, for column-per-channel formats.
  channel_index_patterns:
    - "{chromophore}_ch{NN}"        # canonical: hbo_ch00
    - "{chromophore}{N}"            # HbO1
    - "{chromophore}_channel_{N}"   # HbO_channel_1
    - "fnirs_{chromophore}_{N}"     # fnirs_hbo_1
    - "ch{NN}_{chromophore}"        # ch00_hbo
    - "{chromophore} CH{N}"         # HbO CH1

# ---------------------------------------------------------------------------
# METADATA FIELDS
# ---------------------------------------------------------------------------
metadata:

  subject_id:
    canonical: subject_id
    aliases:
      - subject
      - subj
      - subjectID
      - participant
      - participant_id
      - participantID
      - sub
      - VP              # TU Berlin raw naming (VP001, VP002, ...)
      - S               # Stroop raw naming (S1, S2, ...)
      - id
      - person
    required: true

  trial_id:
    canonical: trial_id
    aliases: [trial, trialID, trial_num, trial_number, epoch, epoch_id, block, block_id]
    required: false

  session_id:
    canonical: session_id
    aliases: [session, sessionID, session_num, run, run_id, visit]
    required: false

  window_id:
    canonical: window_id
    aliases: [window, win, win_id, segment, segment_id]
    required: false

  window_start_sec:
    canonical: window_start_sec
    aliases: [window_start, start_sec, onset_sec, onset, t_start, start_time]
    required: false

  label:
    canonical: Cognitive_Load
    aliases:
      - label
      - labels
      - y
      - target
      - class
      - condition
      - task
      - task_condition
      - load
      - workload
      - cognitive_load
      - CognitiveLoad
      - n_back
      - nback
      - difficulty
      - stimulus_type
      - event_type
    required: false

  sample_rate:
    canonical: sample_rate_hz
    aliases: [fs, sfreq, srate, sampling_rate, sample_rate, samplingFrequency, Fs]
    required: false      # read from the source file where available

# ---------------------------------------------------------------------------
# LABEL VALUE MAPPING
# ---------------------------------------------------------------------------
# Column-name aliasing is not enough — the VALUES also differ per dataset. This
# maps each dataset's raw label values onto the canonical class indices.
# Canonical: 0 = Low, 1 = Medium (3-class bundles only), 2 = High.
# For binary bundles the served mapping is 0 = Low, 1 = High (see
# data_loader.py:335-351 for how the training side collapses 3-class to binary).
label_values:

  tu_berlin_nback:
    description: n-back working-memory load
    map:
      "0": 0        # 0-back  -> Low
      "0-back": 0
      "2": 1        # 2-back  -> Medium
      "2-back": 1
      "3": 2        # 3-back  -> High
      "3-back": 2

  stroop:
    description: >
      Stroop colour-word interference. Event type 1 = neutral/congruent trials,
      type 2 = incongruent trials. Mapping interference onto cognitive load is a
      MODELLING ASSUMPTION, not a measurement: congruent trials are treated as
      low load and incongruent as high load. Recorded here explicitly so the
      assumption is auditable rather than buried in code.
    map:
      "1": 0        # neutral / congruent   -> Low
      "neutral": 0
      "congruent": 0
      "2": 2        # incongruent           -> High
      "incongruent": 2
      "conflict": 2

# ---------------------------------------------------------------------------
# UNIT SUFFIXES stripped during normalization (matching rule 1)
# ---------------------------------------------------------------------------
unit_suffixes:
  - uv
  - µv
  - microvolt
  - microvolts
  - mv
  - v
  - um
  - µm
  - micromolar
  - molar
  - mmol
  - hz
  - sec
  - s
  - ms
  - msec

# ---------------------------------------------------------------------------
# MODALITY TAGS stripped during normalization (matching rule 3)
# ---------------------------------------------------------------------------
modality_tags:
  - eeg
  - fnirs
  - nirs
  - nir
  - ch
  - chan
  - channel
  - elec
  - electrode
  - raw
  - filtered
  - ref
